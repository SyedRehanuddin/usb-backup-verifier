services:
  - type: web
    name: usb-backup-verifier
    runtime: python
    rootDir: CN
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: USB_VERIFIER_MODE
        value: demo
